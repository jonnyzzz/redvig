name: Deploy redvig website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - tools/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelrc
      - .bazelversion
      - bazelw
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: redvig-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build and test the site with Bazel
        run: ./bazelw test --config=ci //website/...
      - name: Copy the site out of bazel-bin
        run: cp -RL bazel-bin/website/site _site && chmod -R u+w _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
